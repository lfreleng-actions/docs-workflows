---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Exercises the reusable workflows in this repository against a real
# documentation project, to prove they function end to end.
#
# The workflows are referenced with the self-repository form ('$/'),
# which resolves this repository at the commit already running, so the
# workflows under test are always the ones this branch defines.
#
# The ReadTheDocs legs stay disabled here. Reaching the API needs an
# RTD_TOKEN a fork may not hold, and the merge lane would create and
# build real ReadTheDocs projects, which a test run has no business
# doing. The rtd-build-action repository covers that behaviour with its
# own suite against an in-memory double, and ONAP exercises it for real
# once it adopts these workflows.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches: ['main']

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  # Structural invariants that a live run cannot cheaply prove, each
  # standing in for a defect that reached production:
  #
  #   * Every checkout names the repository under review. The action
  #     defaults to github.repository, which inside a reusable workflow
  #     names the caller, so a central .github repository would seed the
  #     tree from itself. That failed every ONAP patchset check.
  #
  #   * Every documentation job first establishes that documentation
  #     exists. The ReadTheDocs job creates a project when it finds
  #     none, so an ungated merge registered one for a repository that
  #     ships no documentation at all.
  #
  #   * Every job carries at most one harden-runner step, unconditioned.
  #     The action declares a 'pre' entry point and no 'pre-if', so a
  #     step-level condition does not gate the pre-phase, which is where
  #     the agent engages. A block/audit pair therefore both engaged:
  #     the second collided with the running binary and annotated every
  #     ONAP run with a failure, while the block policy won and the
  #     audit input silently did nothing.
  #
  # Both need a live Gerrit change or a specific repository to
  # reproduce, so guard the shape instead.
  workflow-shape:
    name: 'Workflow Shape'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Every Gerrit checkout names a repository'
        shell: bash
        run: |
          # Every Gerrit checkout names a repository
          fail=0
          for wf in .github/workflows/docs-build.yaml \
                    .github/workflows/docs-audit.yaml; do
            gerrit=$(grep -c 'checkout-gerrit-change-action@' "$wf" || true)
            plain=$(grep -c 'actions/checkout@' "$wf" || true)
            named=$(grep -c 'inputs.repository ||' "$wf" || true)
            expected=$((gerrit + plain))
            echo "$wf: gerrit=$gerrit plain=$plain named=$named"
            if [ "$named" -ne "$expected" ]; then
              echo "::error file=$wf::Expected $expected repository inputs," \
                "found $named; every checkout must name one."
              fail=1
            fi
          done
          if [ "$fail" = '0' ]; then
            echo 'Every checkout names a repository ✅'
          fi
          exit "$fail"

      # Every job that acts on documentation must first establish that
      # documentation exists. The ReadTheDocs job CREATES a project when
      # it finds none, so an ungated merge registers a project for a
      # repository that ships nothing. That happened to onap/.github,
      # which carries no .readthedocs.yaml: the merge lane derived the
      # slug 'onap-.github' and ReadTheDocs rejected it with HTTP 400.
      # Assert the gates rather than trusting review to keep them.
      - name: 'Every documentation job gates on discovery'
        shell: bash
        run: |
          # Every documentation job gates on discovery
          python3 - <<'GATES'
          import re, sys, yaml

          wf = yaml.safe_load(
              open(".github/workflows/docs-build.yaml", encoding="utf-8"))
          jobs = wf["jobs"]

          # ReadTheDocs publishes from .readthedocs.yaml, so it gates on
          # the config. The local build and link check run tox, so they
          # gate on the tox file. A repository may carry one without the
          # other, which is why the signals differ.
          expected = {
              "readthedocs": "needs.audit.outputs.config_found == 'true'",
              "docs": "needs.audit.outputs.tox_path != ''",
              "linkcheck": "needs.audit.outputs.tox_path != ''",
          }

          failures = 0
          for job, needle in expected.items():
              condition = " ".join(str(jobs[job].get("if", "")).split())
              if needle in condition:
                  print(f"{job}: gates on {needle}")
                  continue
              print(f"::error::Job '{job}' must gate on \"{needle}\"; "
                    f"found: {condition or '(no condition)'}")
              failures += 1

          if "config_found" not in jobs["audit"].get("outputs", {}):
              print("::error::The audit job must publish 'config_found'")
              failures += 1

          if not failures:
              print("Every documentation job gates on discovery \u2705")
          sys.exit(1 if failures else 0)
          GATES

      # The build jobs must run where Read the Docs builds, and the
      # audit must run on a fixed image so its runner-os-mismatch check
      # does not flip with GitHub's ubuntu-latest rollout.
      - name: 'Build jobs follow the audit runner'
        shell: bash
        run: |
          # Build jobs follow the audit runner
          python3 - <<'RUNNER'
          import sys, yaml

          failures = 0

          wf = yaml.safe_load(
              open(".github/workflows/docs-build.yaml", encoding="utf-8"))
          jobs = wf["jobs"]
          for job in ("docs", "linkcheck"):
              runs_on = str(jobs[job].get("runs-on", ""))
              if "needs.audit.outputs.runner" in runs_on:
                  print(f"{job}: runs-on follows the audit runner")
                  continue
              print(f"::error::Job '{job}' runs-on must reference "
                    f"needs.audit.outputs.runner; found: {runs_on}")
              failures += 1

          for path in (".github/workflows/docs-build.yaml",
                       ".github/workflows/docs-audit.yaml"):
              wf = yaml.safe_load(open(path, encoding="utf-8"))
              runs_on = wf["jobs"]["audit"].get("runs-on")
              if runs_on == "ubuntu-24.04":
                  print(f"{path}: audit runs on ubuntu-24.04")
                  continue
              print(f"::error file={path}::The audit job must run on "
                    f"ubuntu-24.04; found: {runs_on}")
              failures += 1

          if not failures:
              print("Build jobs follow the audit runner \u2705")
          sys.exit(1 if failures else 0)
          RUNNER

      - name: 'One harden-runner step per job'
        shell: bash
        run: |
          # One harden-runner step per job
          python3 - <<'HARDEN'
          import sys, yaml

          ACTION = "step-security/harden-runner@"
          TOGGLE = "inputs.harden_runner_egress"
          failures = 0

          for path in (".github/workflows/docs-build.yaml",
                       ".github/workflows/docs-audit.yaml"):
              wf = yaml.safe_load(open(path, encoding="utf-8"))
              for job, spec in wf["jobs"].items():
                  steps = [s for s in spec.get("steps", [])
                           if ACTION in str(s.get("uses", ""))]
                  if len(steps) > 1:
                      print(f"::error file={path}::Job '{job}' holds "
                            f"{len(steps)} harden-runner steps; the "
                            "pre-phase ignores 'if:', so each job "
                            "needs exactly one")
                      failures += 1
                  for step in steps:
                      with_ = step.get("with", {})
                      policy = str(with_.get("egress-policy", ""))
                      if "if" in step:
                          print(f"::error file={path}::Job '{job}' "
                                "conditions a harden-runner step; the "
                                "pre-phase runs regardless")
                          failures += 1
                      # A step carrying the allow-list is one of the
                      # toggled jobs, so it must read the input rather
                      # than hard-code a policy.
                      if "allowed-endpoints" in with_ and TOGGLE not in policy:
                          print(f"::error file={path}::Job '{job}' must "
                                f"select its policy from {TOGGLE}; "
                                f"found '{policy}'")
                          failures += 1
                  if steps:
                      print(f"{path}: {job}: {len(steps)} harden-runner step")

          if not failures:
              print("One harden-runner step per job \u2705")
          sys.exit(1 if failures else 0)
          HARDEN

      # A step that loads the supplemental list but drops the unpinned
      # opt-in would refuse an unpinned list in that job alone, so the
      # caller's input would work in some jobs and fail in others.
      - name: 'Every supplemental list passes the unpinned opt-in'
        shell: bash
        run: |
          # Every supplemental list passes the unpinned opt-in
          python3 - <<'UNPINNED'
          import sys, yaml

          INPUT = "inputs.harden_runner_supplemental_unpinned"
          failures = 0
          checked = 0

          for path in (".github/workflows/docs-build.yaml",
                       ".github/workflows/docs-audit.yaml"):
              wf = yaml.safe_load(open(path, encoding="utf-8"))
              for job, spec in wf["jobs"].items():
                  for step in spec.get("steps", []):
                      with_ = step.get("with", {}) or {}
                      if "supplemental_config" not in with_:
                          continue
                      checked += 1
                      value = str(with_.get("supplemental_unpinned", ""))
                      if INPUT in value:
                          print(f"{path}: {job}: passes "
                                "supplemental_unpinned")
                          continue
                      print(f"::error file={path}::Job '{job}' step "
                            f"'{step.get('name', '')}' passes "
                            "supplemental_config without "
                            f"supplemental_unpinned from {INPUT}")
                      failures += 1

          if not checked:
              print("::error::No step passes supplemental_config; "
                    "the check matched nothing")
              failures += 1

          if not failures:
              print("Every supplemental list passes the unpinned "
                    "opt-in \u2705")
          sys.exit(1 if failures else 0)
          UNPINNED

      # setup-uv runs 'uv python find' and executes the interpreter it
      # returns. The lookup follows its working directory, PATH and uv's
      # own variables, which an earlier step can set through GITHUB_ENV
      # or GITHUB_PATH. The ReadTheDocs job, the one reusable setup-uv
      # user, cannot run here without an RTD_TOKEN, so pin the guarded
      # settings instead; the uv-isolation job proves they hold. Its
      # copy of the step is checked too, so it cannot drift from the
      # one it stands in for.
      - name: 'Every setup-uv step ignores the job environment'
        shell: bash
        run: |
          # Every setup-uv step ignores the job environment
          python3 -I - <<'SETUPUV'
          import sys, yaml

          ACTION = "astral-sh/setup-uv@"
          # Split so the runner does not expand it inside this script.
          TEMP = "$" + "{{ runner.temp }}"
          WANT_WITH = {
              "working-directory": TEMP,
              "tool-bin-dir": TEMP + "/uv-tool-bin",
              "enable-cache": "false",
          }
          # Each one exports interpreter settings to later steps.
          BANNED_WITH = ("python-version", "activate-environment")
          WANT_ENV = {
              "UV_NO_CONFIG": "1",
              "UV_NO_PROJECT": "1",
              "UV_PYTHON_PREFERENCE": "lookup-disabled",
              "UV_PYTHON_ARCH": "",
              "UV_PYTHON_INSTALL_DIR": TEMP + "/uv-python",
          }
          failures = 0
          seen = 0

          def fail(path, job, message):
              global failures
              print(f"::error file={path}::Job '{job}': setup-uv {message}")
              failures += 1

          for path in (".github/workflows/docs-build.yaml",
                       ".github/workflows/docs-audit.yaml",
                       ".github/workflows/testing.yaml"):
              wf = yaml.safe_load(open(path, encoding="utf-8"))
              for job, spec in wf["jobs"].items():
                  for step in spec.get("steps", []):
                      if ACTION not in str(step.get("uses", "")):
                          continue
                      seen += 1
                      with_ = step.get("with", {}) or {}
                      for key, want in WANT_WITH.items():
                          got = with_.get(key)
                          if str(got).lower() != want:
                              fail(path, job, f"input {key} is {got!r}, "
                                   f"expected {want!r}")
                      for key in BANNED_WITH:
                          if key in with_:
                              fail(path, job, f"sets input {key}")
                      env = step.get("env", {}) or {}
                      if env != WANT_ENV:
                          fail(path, job, f"env is {env!r}, expected "
                               f"{WANT_ENV!r}")
                      print(f"{path}: {job}: setup-uv checked")

          if not seen:
              print("::error::No setup-uv step found; update this check")
              failures += 1
          if not failures:
              print("Every setup-uv step ignores the job environment \u2705")
          sys.exit(1 if failures else 0)
          SETUPUV

  # setup-uv executes the interpreter 'uv python find' returns. A called
  # job inherits nothing from its caller's env, but any earlier step of
  # the same job can set variables and PATH through GITHUB_ENV and
  # GITHUB_PATH. Plant a bait interpreter on every route uv reads, prove
  # the bait is live, then prove the guarded setup-uv step starts none
  # of it. Each leg covers routes uv cannot take together: UV_PYTHON
  # takes precedence over the virtual environment variables. Both legs
  # plant a bait 'uv' in UV_PYTHON_INSTALL_DIR, which setup-uv puts on
  # PATH ahead of its own uv, and a bait '.venv' in the workspace.
  uv-isolation:
    name: 'uv Isolation (${{ matrix.route }})'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        route: ['uv-python', 'environment']
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      - name: 'Plant bait interpreters'
        shell: bash
        env:
          ROUTE: ${{ matrix.route }}
        run: |
          # Plant bait interpreters
          set -euo pipefail
          venv="$GITHUB_WORKSPACE/.venv"
          bin="$venv/bin"
          install_dir="$GITHUB_WORKSPACE/uv-python-install"
          marker="$RUNNER_TEMP/uv-bait-marker"
          mkdir -p "$bin" "$venv/conda-meta" "$install_dir"
          # Each bait records that it started, then fails: uv skips an
          # interpreter that fails, so only the marker proves a start.
          bait() {
            printf '#!/bin/sh\necho "%s $*" >> "%s"\nexit 1\n' \
              "$1" "$marker" > "$2"
            chmod +x "$2"
          }
          for name in python python3 python3.13 uv; do
            bait "$name" "$bin/$name"
          done
          bait 'UV_PYTHON_INSTALL_DIR uv' "$install_dir/uv"
          printf 'home = %s\nversion = 3.13.0\n' "$bin" > "$venv/pyvenv.cfg"

          echo "$bin" >> "$GITHUB_PATH"
          {
            echo 'UV_PYTHON_ARCH=x86_64'
            echo 'UV_NO_CACHE=1'
            echo "UV_PYTHON_INSTALL_DIR=$install_dir"
            case "$ROUTE" in
              uv-python)
                echo "UV_PYTHON=$bin/python3"
                echo "UV_PYTHON_SEARCH_PATH=$bin"
                ;;
              environment)
                echo "VIRTUAL_ENV=$venv"
                echo "CONDA_PREFIX=$venv"
                echo "UV_INTERNAL__PARENT_INTERPRETER=$bin/python3"
                ;;
              *)
                echo "::error::Unknown route '$ROUTE'" >&2
                exit 1
                ;;
            esac
          } >> "$GITHUB_ENV"

      # A bait that never starts proves nothing, so start each planted
      # route directly and require the marker. The interpreter runs by
      # absolute path: on PATH, python3 is now the bait.
      - name: 'Control: the bait is live'
        shell: bash
        run: |
          # Control: the bait is live
          /usr/bin/python3 -I - <<'CONTROL'
          import os, shutil, subprocess, sys

          marker = os.path.join(os.environ["RUNNER_TEMP"], "uv-bait-marker")
          env = os.environ
          routes = {
              "PATH python3": shutil.which("python3"),
              "PATH uv": shutil.which("uv"),
          }
          for var in ("UV_PYTHON", "UV_INTERNAL__PARENT_INTERPRETER"):
              if env.get(var):
                  routes[var] = env[var]
          for var in ("UV_PYTHON_SEARCH_PATH",):
              if env.get(var):
                  routes[var] = os.path.join(env[var], "python3")
          # setup-uv puts this directory on PATH and runs a bare 'uv'.
          # Unset, the route stays None and fails below rather than
          # resolving 'uv' through PATH.
          install_dir = env.get("UV_PYTHON_INSTALL_DIR")
          routes["UV_PYTHON_INSTALL_DIR uv"] = (
              os.path.join(install_dir, "uv") if install_dir else None)
          for var in ("VIRTUAL_ENV", "CONDA_PREFIX"):
              if env.get(var):
                  routes[var] = os.path.join(env[var], "bin", "python3")

          failures = 0
          for route, target in routes.items():
              if os.path.exists(marker):
                  os.remove(marker)
              if target:
                  subprocess.run([target], check=False)
              if os.path.exists(marker):
                  print(f"{route}: {target} started the bait")
                  continue
              print(f"::error::{route} ({target}) did not start the bait")
              failures += 1
          if os.path.exists(marker):
              os.remove(marker)
          if len(routes) < 5:
              print(f"::error::Only {len(routes)} routes planted")
              failures += 1
          sys.exit(1 if failures else 0)
          CONTROL

      # Keep in step with the 'Install uv' step in docs-build.yaml; the
      # workflow-shape job checks both carry the same settings.
      - name: 'Install uv'
        id: setup-uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        env:
          UV_NO_CONFIG: '1'
          UV_NO_PROJECT: '1'
          UV_PYTHON_PREFERENCE: 'lookup-disabled'
          UV_PYTHON_ARCH: ''
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-python
        with:
          working-directory: ${{ runner.temp }}
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin
          enable-cache: 'false'
          ignore-empty-workdir: 'true'

      - name: 'No bait started'
        if: ${{ !cancelled() }}
        shell: bash
        env:
          UV_PATH: ${{ steps.setup-uv.outputs.uv-path }}
        run: |
          # No bait started
          fail=0
          marker="$RUNNER_TEMP/uv-bait-marker"
          case "$UV_PATH" in
            '' | "$GITHUB_WORKSPACE"/*)
              echo "::error::setup-uv reported uv at '$UV_PATH'"
              fail=1
              ;;
            *)
              "$UV_PATH" --version || fail=1
              ;;
          esac
          if [ -e "$marker" ]; then
            echo '::error::A planted interpreter started:'
            cat "$marker"
            fail=1
          fi
          if [ "$fail" = '0' ]; then
            echo 'No planted interpreter started ✅'
          fi
          exit "$fail"

  # The standalone audit against this repository, which ships a
  # ReadTheDocs configuration and so exercises the discovery path.
  audit:
    name: 'Audit'
    permissions:
      contents: read
    uses: $/.github/workflows/docs-audit.yaml

  # Prove the policy inputs reach the audit action. Naming a build image
  # that differs from the one this repository declares yields a warning
  # rather than an error, so the leg proves the plumbing without turning
  # a check red. Asserting on the finding is also stronger than asserting
  # on a failure: it shows which input landed, not merely that one did.
  audit-policy:
    name: 'Audit With Policy'
    permissions:
      contents: read
    uses: $/.github/workflows/docs-audit.yaml
    with:
      build_os: 'ubuntu-24.04'

  # The full pipeline in verify mode against a real documentation
  # project. lftools-uv keeps its docs and docs-linkcheck environments in
  # the root tox.ini rather than docs/tox.ini, so this also proves the
  # workflow follows wherever the audit locates them.
  verify:
    name: 'Verify'
    permissions:
      contents: read
    uses: $/.github/workflows/docs-build.yaml
    with:
      mode: 'verify'
      repository: 'lfreleng-actions/lftools-uv'
      rtd_enabled: false
      # Exercise the allow-list inputs without granting anything new.
      # A same-organisation list may follow its default branch, and
      # 'lfreleng-actions//' resolves to the organisation list itself,
      # which de-duplication absorbs. The organisation list already
      # carries github.com:443, so the action reports it as redundant.
      harden_runner_supplemental_allowlist: 'lfreleng-actions//'
      harden_runner_supplemental_unpinned: true
      harden_runner_extra_endpoints: 'github.com:443'

  # tox-run-action needs Python 3.11 or newer to run tox, so a project
  # documenting on an older Python gets a second, newer one for tox.
  # Each fixture under tests/fixtures/docs-python stands in for a
  # documentation build that fails unless it ran on the declared Python,
  # so a passing leg proves which interpreter built it, not merely that
  # tox ran. The fixtures declare build.os: ubuntu-24.04, so the build
  # jobs run there; setup-python has no 3.8 or 3.9 for Ubuntu 26.04.
  # linkcheck_advisory is off so a link check on the wrong Python fails
  # the leg too.
  #
  # Python 3.10 pinned by basepython in [testenv:docs]. Its
  # docs-linkcheck environment pins nothing, so it also covers the
  # override.
  docs-python-basepython:
    name: 'Docs Python 3.10 (tox basepython)'
    permissions:
      contents: read
    uses: $/.github/workflows/docs-build.yaml
    with:
      mode: 'verify'
      path_prefix: 'tests/fixtures/docs-python/py310-basepython'
      rtd_enabled: false
      linkcheck_advisory: false

  # Python 3.10 declared only by .readthedocs.yaml. Without the
  # default_base_python override, both environments would build on
  # the Python running tox.
  docs-python-rtd:
    name: 'Docs Python 3.10 (Read the Docs only)'
    permissions:
      contents: read
    uses: $/.github/workflows/docs-build.yaml
    with:
      mode: 'verify'
      path_prefix: 'tests/fixtures/docs-python/py310-rtd'
      rtd_enabled: false
      linkcheck_advisory: false

  # Python 3.12 runs tox itself, so the build sets up that one alone.
  docs-python-current:
    name: 'Docs Python 3.12'
    permissions:
      contents: read
    uses: $/.github/workflows/docs-build.yaml
    with:
      mode: 'verify'
      path_prefix: 'tests/fixtures/docs-python/py312'
      rtd_enabled: false
      linkcheck_advisory: false

  outcome:
    name: 'Report Outcome'
    if: ${{ always() }}
    needs:
      - audit
      - audit-policy
      - verify
      - workflow-shape
      - uv-isolation
      - docs-python-basepython
      - docs-python-rtd
      - docs-python-current
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: 'Check results'
        shell: bash
        env:
          AUDIT: ${{ needs.audit.result }}
          POLICY: ${{ needs.audit-policy.result }}
          POLICY_FINDINGS: ${{ needs.audit-policy.outputs.findings_json }}
          VERIFY: ${{ needs.verify.result }}
          VERIFY_RUNNER: ${{ needs.verify.outputs.runner }}
          CHECKOUTS: ${{ needs.workflow-shape.result }}
          UV_ISOLATION: ${{ needs.uv-isolation.result }}
          PINNED: ${{ needs.docs-python-basepython.result }}
          # yamllint disable-line rule:line-length
          PINNED_VERSIONS: ${{ needs.docs-python-basepython.outputs.python_versions }}
          RTD: ${{ needs.docs-python-rtd.result }}
          RTD_VERSIONS: ${{ needs.docs-python-rtd.outputs.python_versions }}
          CURRENT: ${{ needs.docs-python-current.result }}
          # yamllint disable-line rule:line-length
          CURRENT_VERSIONS: ${{ needs.docs-python-current.outputs.python_versions }}
        run: |
          # Check results
          fail=0
          if [ "${AUDIT}" != 'success' ]; then
            echo "::error::Audit leg reported ${AUDIT}"
            fail=1
          fi
          if [ "${CHECKOUTS}" != 'success' ]; then
            echo "::error::Workflow shape leg reported ${CHECKOUTS}"
            fail=1
          fi
          if [ "${UV_ISOLATION}" != 'success' ]; then
            echo "::error::uv isolation leg reported ${UV_ISOLATION}"
            fail=1
          fi
          if [ "${VERIFY}" != 'success' ]; then
            echo "::error::Verify leg reported ${VERIFY}"
            fail=1
          fi
          # lftools-uv declares build.os: ubuntu-24.04, so the audit must
          # map it to that runner for the build jobs to follow it.
          if [ "${VERIFY_RUNNER}" != 'ubuntu-24.04' ]; then
            echo "::error::Verify leg reported runner '${VERIFY_RUNNER}';" \
              "expected ubuntu-24.04"
            fail=1
          fi
          if [ "${POLICY}" != 'success' ]; then
            echo "::error::Policy leg reported ${POLICY}"
            fail=1
          fi
          # The policy leg named a build image this repository does not
          # declare, so the audit must have reported the mismatch. A
          # silent pass would mean build_os never reached the action.
          if ! printf '%s' "${POLICY_FINDINGS}" \
            | grep -q 'build-os-mismatch'; then
            echo '::error::Policy leg reported no build-os-mismatch finding;'
            echo '::error::the build_os input did not reach the audit'
            fail=1
          fi
          # Each docs Python leg must pass, which proves its build ran on
          # the declared Python, and must have set up the expected
          # versions: the declared one, then 3.13 for tox when the
          # declared one is older than 3.11.
          # The versions arrive one per line; join them for comparison.
          joined() {
            printf '%s' "$1" | tr -s '\n' ' ' | sed 's/^ //; s/ $//'
          }
          for leg in \
            "pinned|${PINNED}|$(joined "${PINNED_VERSIONS}")|3.10 3.13" \
            "rtd|${RTD}|$(joined "${RTD_VERSIONS}")|3.10 3.13" \
            "current|${CURRENT}|$(joined "${CURRENT_VERSIONS}")|3.12"; do
            IFS='|' read -r name result versions expected <<< "${leg}"
            if [ "${result}" != 'success' ]; then
              echo "::error::Docs Python ${name} leg reported ${result}"
              fail=1
            fi
            if [ "${versions}" != "${expected}" ]; then
              echo "::error::Docs Python ${name} leg set up" \
                "'${versions}'; expected '${expected}'"
              fail=1
            fi
          done
          if [ "${fail}" = '0' ]; then
            echo 'All legs behaved as expected ✅'
            echo 'All legs behaved as expected ✅' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "${fail}"
