---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Exercises the reusable workflows in this repository against a real
# documentation project, to prove they function end to end.
#
# The workflows are referenced by LOCAL path so this always validates the
# current branch.
#
# The ReadTheDocs legs stay disabled here. Reaching the API needs an
# RTD_TOKEN a fork may not hold, and the merge lane would create and
# build real ReadTheDocs projects, which a test run has no business
# doing. The rtd-build-action repository covers that behaviour with its
# own suite against an in-memory double, and ONAP exercises it for real
# once it adopts these workflows.
name: 'Testing 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches: ['main']

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  # The standalone audit against this repository, which ships a
  # ReadTheDocs configuration and so exercises the discovery path.
  audit:
    name: 'Audit'
    permissions:
      contents: read
    uses: ./.github/workflows/docs-audit.yaml

  # Prove the policy inputs reach the audit action. Naming a build image
  # that differs from the one this repository declares yields a warning
  # rather than an error, so the leg proves the plumbing without turning
  # a check red. Asserting on the finding is also stronger than asserting
  # on a failure: it shows which input landed, not merely that one did.
  audit-policy:
    name: 'Audit With Policy'
    permissions:
      contents: read
    uses: ./.github/workflows/docs-audit.yaml
    with:
      build_os: 'ubuntu-24.04'

  # The full pipeline in verify mode against a real documentation
  # project. lftools-uv keeps its docs and docs-linkcheck environments in
  # the root tox.ini rather than docs/tox.ini, so this also proves the
  # workflow follows wherever the audit locates them.
  verify:
    name: 'Verify'
    permissions:
      contents: read
    uses: ./.github/workflows/docs-build.yaml
    with:
      mode: 'verify'
      repository: 'lfreleng-actions/lftools-uv'
      rtd_enabled: false

  outcome:
    name: 'Report Outcome'
    if: ${{ always() }}
    needs: [audit, audit-policy, verify]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: 'Check results'
        shell: bash
        env:
          AUDIT: ${{ needs.audit.result }}
          POLICY: ${{ needs.audit-policy.result }}
          POLICY_FINDINGS: ${{ needs.audit-policy.outputs.findings_json }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          # Check results
          fail=0
          if [ "${AUDIT}" != 'success' ]; then
            echo "::error::Audit leg reported ${AUDIT}"
            fail=1
          fi
          if [ "${VERIFY}" != 'success' ]; then
            echo "::error::Verify leg reported ${VERIFY}"
            fail=1
          fi
          if [ "${POLICY}" != 'success' ]; then
            echo "::error::Policy leg reported ${POLICY}"
            fail=1
          fi
          # The policy leg named a build image this repository does not
          # declare, so the audit must have reported the mismatch. A
          # silent pass would mean build_os never reached the action.
          if ! printf '%s' "${POLICY_FINDINGS}" \
            | grep -q 'build-os-mismatch'; then
            echo '::error::Policy leg reported no build-os-mismatch finding;'
            echo '::error::the build_os input did not reach the audit'
            fail=1
          fi
          if [ "${fail}" = '0' ]; then
            echo 'All legs behaved as expected ✅'
            echo 'All legs behaved as expected ✅' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "${fail}"
