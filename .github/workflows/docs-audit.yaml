---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable ReadTheDocs configuration audit.
#
# Checks a repository's documentation setup for policy compliance and
# reports the Python version its build should use, without building
# anything or contacting ReadTheDocs. Suits a repository that wants the
# policy check alone, or one adopting the checks before it adopts the
# full pipeline.
#
# Projects running the whole pipeline should call docs-build.yaml
# instead, which performs this audit as its first job.
name: '[R] Documentation Audit'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      # --- Checkout target (defaults to the calling repository) ---
      repository:
        description: 'Repository to check out (owner/name)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Branch/tag/SHA to check out (empty = default branch)'
        required: false
        type: string
        default: ''

      # --- Gerrit-aware checkout (empty unless dispatched via Gerrit) ---
      gerrit_refspec:
        description: 'Gerrit refspec of the change under test'
        required: false
        type: string
        default: ''
      gerrit_project:
        description: 'Gerrit project name'
        required: false
        type: string
        default: ''
      gerrit_branch:
        description: 'Gerrit branch the change targets'
        required: false
        type: string
        default: ''
      gerrit_url:
        description: 'Gerrit server URL (falls back to the GERRIT_URL variable)'
        required: false
        type: string
        default: ''

      # --- Project layout ---
      path_prefix:
        description: 'Path to the project root directory'
        required: false
        type: string
        default: '.'
      tox_file:
        description: >-
          Path to the tox file holding the documentation environments;
          empty searches docs/tox.ini then tox.ini
        required: false
        type: string
        default: ''

      # --- Policy ---
      required_files:
        description: 'Files the project must ship (newline or comma separated)'
        required: false
        type: string
        default: ''
      forbidden_files:
        description: 'Files the project must not ship'
        required: false
        type: string
        default: ''
      build_os:
        description: 'Expected build.os value; empty accepts any'
        required: false
        type: string
        default: ''
      python_version:
        description: 'Expected build.tools.python value; empty accepts any'
        required: false
        type: string
        default: ''
      eol_behaviour:
        description: 'End-of-life Python handling: warn, fail or ignore'
        required: false
        type: string
        default: 'warn'
      linkcheck_policy:
        description: "Handling of '-W' on a linkcheck builder"
        required: false
        type: string
        default: 'warn'
      require_sphinx_strict:
        description: "Expect '-W' on documentation builds"
        required: false
        type: boolean
        default: false
      fail_on_warning:
        description: 'Fail when the audit reports warnings'
        required: false
        type: boolean
        default: false

      # --- Runner hardening ---
      harden_runner_egress:
        description: "Harden-runner egress policy: 'block' or 'audit'"
        required: false
        type: string
        default: 'block'
      harden_runner_allowlist:
        description: 'Out-of-band harden-runner allow-list configuration'
        required: false
        type: string
        # yamllint disable-line rule:line-length
        default: 'lfreleng-actions//.github/harden-runner/lfreleng-actions/allow_list.txt@f0f76ac22f342c9a788ebcabe584e68a79cc2e83'  # v0.16.0

    outputs:
      passed:
        description: 'Whether the audit completed without a failing finding'
        value: ${{ jobs.audit.outputs.passed }}
      docs_python:
        description: 'Python version the documentation build should use'
        value: ${{ jobs.audit.outputs.docs_python }}
      findings_json:
        description: 'Complete audit report as a JSON string'
        value: ${{ jobs.audit.outputs.findings_json }}
      tox_path:
        description: 'Path of the tox file the audit inspected'
        value: ${{ jobs.audit.outputs.tox_path }}

permissions: {}

jobs:
  audit:
    name: 'Configuration Audit'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      passed: ${{ steps.audit.outputs.passed }}
      docs_python: ${{ steps.audit.outputs.docs_python }}
      findings_json: ${{ steps.audit.outputs.findings_json }}
      tox_path: ${{ steps.audit.outputs.tox_path }}
    steps:
      - name: 'Load egress allow-list'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@6db537b3e6d060c3287c5a3ce2c28b55b0af330d  # v0.2.1
        with:
          config: ${{ inputs.harden_runner_allowlist }}
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          # yamllint disable-line rule:line-length
          egress-policy: ${{ inputs.harden_runner_egress == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: 'Checkout Gerrit change'
        if: inputs.gerrit_refspec != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/checkout-gerrit-change-action@298f53bbbc1d5f9e54df9feb484d110dc2b33197  # v1.1.0
        with:
          gerrit-refspec: ${{ inputs.gerrit_refspec }}
          gerrit-project: ${{ inputs.gerrit_project }}
          # yamllint disable-line rule:line-length
          gerrit-url: ${{ inputs.gerrit_url != '' && inputs.gerrit_url || vars.GERRIT_URL }}
          delay: '0s'
          # The action defaults this to github.repository, which inside a
          # reusable workflow names the caller rather than the project
          # under review.
          repository: ${{ inputs.repository || github.repository }}
          ref: refs/heads/${{ inputs.gerrit_branch }}
          submodules: 'true'
      - name: 'Checkout repository'
        if: inputs.gerrit_refspec == ''
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: 'true'
          persist-credentials: false

      - name: 'Audit ReadTheDocs configuration'
        id: audit
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/rtd-config-audit-action@6546f9cca69838d78ed6eb0b5846e493796f5038  # v0.1.0
        with:
          path_prefix: ${{ inputs.path_prefix }}
          tox_file: ${{ inputs.tox_file }}
          required_files: ${{ inputs.required_files }}
          forbidden_files: ${{ inputs.forbidden_files }}
          build_os: ${{ inputs.build_os }}
          python_version: ${{ inputs.python_version }}
          eol_behaviour: ${{ inputs.eol_behaviour }}
          linkcheck_policy: ${{ inputs.linkcheck_policy }}
          require_sphinx_strict: ${{ inputs.require_sphinx_strict }}
          fail_on_warning: ${{ inputs.fail_on_warning }}
