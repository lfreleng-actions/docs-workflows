# Test fixture for testing.yaml: each environment records the Python it
# ran on and checks Graphviz and APT without project packages.
[tox]
no_package = true

[testenv]
skip_install = true
allowlist_externals =
    dot
    bash
commands =
    python {toxinidir}{/}..{/}record_python.py 3.11
    dot -V
    bash {toxinidir}{/}check_apt.sh

[testenv:docs]

[testenv:docs-linkcheck]
