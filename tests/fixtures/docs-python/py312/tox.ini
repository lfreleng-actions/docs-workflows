# Test fixture for testing.yaml: each environment records the Python it
# ran on and runs the APT package declared in .readthedocs.yaml.
[tox]
no_package = true

[testenv]
skip_install = true
allowlist_externals = /usr/bin/hello
commands =
    python {toxinidir}{/}..{/}record_python.py 3.12
    /usr/bin/hello

[testenv:docs]

[testenv:docs-linkcheck]
