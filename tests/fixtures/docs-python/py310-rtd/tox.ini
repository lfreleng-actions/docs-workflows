# Test fixture for testing.yaml: each environment records the Python it
# ran on and fails unless that is Python 3.10.
[tox]
no_package = true

[testenv:docs]
skip_install = true
commands = python {toxinidir}{/}..{/}record_python.py 3.10

[testenv:docs-linkcheck]
skip_install = true
commands = python {toxinidir}{/}..{/}record_python.py 3.10
